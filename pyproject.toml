[project]
name = "baking-lyrics"
version = "0.5.0"
description = "Baking Lyrics API: a lyrics and title generator powered by deep learning models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "flask-restx>=1.3",
    "flask-bcrypt>=1.0",
    "pandas>=2.2",
    "numpy>=2.1",
    "boto3>=1.35",
    "gunicorn>=23.0; sys_platform != 'win32'",
    "python-dotenv>=1.0",
    "flask-cors>=6.0",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.20",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx>=9.1.1",
]
train = [
    "torch>=2.9",
    "onnx>=1.17",
    "onnxscript>=0.5",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "kagglehub>=0.3",
    "fast-langdetect>=1.0",
    "tqdm>=4.66",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["baking/tests", "ml/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["baking"]
omit = [
    "baking/resources/*",
    "baking/static/*",
]
