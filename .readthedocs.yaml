# Read the Docs build of the model documentation (docs/, Sphinx with MyST Markdown)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# uv sync with the docs group, respecting uv.lock; torch and onnx are mocked in docs/conf.py
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
