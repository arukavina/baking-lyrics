name: Deploy

# Builds the API container image, pushes it to Amazon ECR and points the Lambda function at it.
# Secrets (environment "production"): AWS_DEPLOY_ROLE_ARN, AWS_REGION, ECR_REPOSITORY,
# LAMBDA_FUNCTION_NAME and API_BASE_URL (the Lambda Function URL, without a trailing slash).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-deploy-baking-lyrics

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # The base images come from ECR Public, whose anonymous pull quota is shared by every job on
      # the same runner IP. Pulling as the deploy role avoids "429 Too Many Requests" during the build.
      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_DATE: ${{ steps.commit.outputs.date }}
        # Lambda only accepts a plain single platform image. Provenance and SBOM attestations would turn
        # the push into an image index that Lambda rejects.
        run: |
          image="$REGISTRY/$REPOSITORY:$COMMIT_SHA"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg "BAKING_COMMIT_SHA=$COMMIT_SHA" \
            --build-arg "BAKING_COMMIT_DATE=$COMMIT_DATE" \
            -t "$image" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            --push \
            .
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy the image to Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --output text --query LastUpdateStatus
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Smoke test
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          base="${API_BASE_URL%/}/api/v1/general"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 "$base/ping"; then
              echo
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::ping did not answer after $attempt attempts"
              exit 1
            fi
            sleep 10
          done
          version=$(curl --fail --silent --show-error --max-time 30 "$base/version")
          echo "$version"
          deployed=$(echo "$version" | jq -r '.commit')
          if [ "$deployed" != "$COMMIT_SHA" ]; then
            echo "::error::the API reports commit $deployed, expected $COMMIT_SHA"
            exit 1
          fi

          # The stats read DynamoDB, so this also checks the tables and the function's permissions
          status=$(curl --silent --show-error --max-time 30 -o stats.json -w '%{http_code}' "$base/stats")
          cat stats.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::stats answered HTTP $status, expected 200"
            exit 1
          fi
          if ! jq -e 'type == "object" and has("artists")' stats.json > /dev/null; then
            echo "::error::stats is not a JSON object with artists"
            exit 1
          fi

          # CORS: the production frontend origin must be echoed back (ALLOWED_ORIGINS)
          origin="https://baking-lyrics-web.vercel.app"
          allowed=$(curl --fail --silent --show-error --max-time 30 -o /dev/null -D - -H "Origin: $origin" "$base/ping" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "access-control-allow-origin" {print $2}')
          if [ "$allowed" != "$origin" ]; then
            echo "::error::Access-Control-Allow-Origin is '$allowed', expected $origin"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          {
            echo "### Backend deploy"
            echo
            echo "- Image: \`$IMAGE_URI\`"
            echo "- API: ${API_BASE_URL%/}/api/v1"
            echo "- Version: ${API_BASE_URL%/}/api/v1/general/version"
          } >> "$GITHUB_STEP_SUMMARY"
