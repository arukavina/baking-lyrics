name: CI

# Pull requests run it directly; pushes to master run it from deploy.yml before deploying.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_CONFIG_FILE: config/testing.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      # The ml extra (onnxruntime) is what production serves with; torch (train group) stays out of CI
      - run: uv sync --locked --extra ml
      - run: uv run ruff check .
      - run: uv run pytest --cov=baking --cov-report=term --cov-report=xml
      # A Codecov outage or a fork without the secret must not block merges or deploys
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
